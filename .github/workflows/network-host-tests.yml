name: Network policy host tests
on:
  push:
    branches: [main, "feat/**"]
    paths: ["include/**", "src/**", "tests/**", "CMakeLists.txt", ".github/workflows/network-host-tests.yml"]
  pull_request:
    paths: ["include/**", "src/**", "tests/**", "CMakeLists.txt", ".github/workflows/network-host-tests.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build
      - run: cmake --build build --parallel
      - run: ctest --test-dir build --output-on-failure
